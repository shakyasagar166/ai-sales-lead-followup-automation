version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sales-automation-backend
    ports:
      - "8000:8000"
    environment:
      - DEFAULT_API_KEY=sales-automation-secret-key-2026
      - DATABASE_URL=sqlite:///./sales_automation.db
      - MOCK_LLM_MODE=true
    volumes:
      - ../backend/sales_automation.db:/app/sales_automation.db
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: sales-automation-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
